<!--
  ============================================================================
  Archivo:     templates/fragments/head.html
  Propósito:   Bloque de cabecera común a las siete páginas. Se copia tal cual
               al inicio de cada archivo HTML del proyecto.
  Integrante:  ______________________________

  Solo cambia una cosa por página: el contenido de <title>.
  La ruta de estilos.css es siempre ../static/css/estilos.css, porque las
  siete páginas viven directamente dentro de templates/.

  En el APF2 este bloque pasa a ser un th:fragment y el título se recibe
  como parámetro.

  MARCA: el nombre X7 aparece en <title>. Es un nombre de reemplazo.
  ============================================================================
-->
<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Pasteleria y catering en Ica. Tortas decoradas por encargo, bocaditos tematicos y buffets para eventos.">

  <title>X7 Pasteleria y Catering</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Hoja propia. Va al final para que sus colores ganen a los de Bootstrap -->
  <link href="../static/css/estilos.css" rel="stylesheet">

  <link rel="icon" href="../static/img/logo.svg" type="image/svg+xml">

</head>
